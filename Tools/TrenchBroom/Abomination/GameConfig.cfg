{
    // Tells TrenchBroom (the level editor) about Abomination: which map format to write, where the textures are and
    // which entities can be placed. The game itself does not read this file; it only reads the .map files.
    // TrenchBroom finds this folder through a link in %APPDATA%\TrenchBroom\games (see Documentation/LEVEL_EDITING.md).
    version: 9,
    name: "Abomination",
    "fileformats": [
        // Valve 220: like the original Quake format, but every face also stores the exact axes of its texture,
        // so textures can be placed at any angle and scale.
        { "format": "Valve" }
    ],
    "filesystem": {
        // Relative to the game path set in TrenchBroom's preferences (the root of the repository).
        "searchpath": "Assets",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        // TrenchBroom makes one material collection per folder directly under the root and does not look deeper, so
        // the root is Assets/Textures and its folders (Episode1, Common, ...) are the collections. A face on a map
        // refers to its texture by the path under the root without the extension: "Episode1/Wall_MossyBrick" for
        // Assets/Textures/Episode1/Wall_MossyBrick.png.
        "root": "Textures",
        "format": { "extensions": [".png"], "format": "image" },
        // The maps of the materials lie next to their colors (see Renderer::LoadMaterialByFileNames) but are not textures
        // to put on a face: they are hidden from the material browser.
        "excludes": [ "*_Normal", "*_MetalRough", "*_Emissive", "*_Height" ]
    },
    "entities": {
        "definitions": [ "Abomination.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [],
        // Clip faces are drawn see-through, so the stairs under a clip ramp stay visible (see World::IsClipBrush).
        "brushface": [
            { "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "Common/Clip" }
        ]
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    }
}
