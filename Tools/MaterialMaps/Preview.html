<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material maps</title>
<!-- The template of the preview page Generate.ps1 writes into Build/MaterialMaps: it puts the textures in place of the
     empty list below. The lighting is the one of Assets/Shaders/Lit.frag (GGX, ACES, sRGB), for a surface seen straight
     on, so a texture looks here as it will in the game. -->
<style>
  :root { --bg: #f4f2ed; --panel: #fff; --text: #1d1c1a; --muted: #6b675f; --line: #ddd8cc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --panel: #212226; --text: #e9e6df; --muted: #a29d93; --line: #34353a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .controls { position: sticky; top: 0; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line);
              z-index: 1; display: flex; gap: 18px; flex-wrap: wrap; }
  label { display: flex; gap: 8px; align-items: center; }
  .texture { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 14px 0; }
  .texture h2 { font-size: 17px; margin: 0 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { color: var(--muted); font-size: 13px; }
  canvas { image-rendering: pixelated; border-radius: 4px; display: block; }
</style>
</head>
<body>
<main>
<h1>Material maps of Episode 1</h1>
<p>Every texture tiled 2 x 2: as it is lit now (flat, roughness 0.8), with its generated maps, and the maps themselves.
Move the light: on a texture with good maps the stones stand out and the light runs over them.</p>
<div class="controls">
  <label>Light direction <input id="azimuth" type="range" min="0" max="360" value="135"></label>
  <label>Light height <input id="elevation" type="range" min="5" max="85" value="35"></label>
  <label>Scale <input id="scale" type="range" min="1" max="4" value="2"></label>
</div>
<div id="list"></div>
</main>
<script>
const textures = /*TEXTURES*/[];

const clamp01 = x => Math.min(1, Math.max(0, x));
const toLinear = v => v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
const toSRGB = l => l <= 0.0031308 ? l * 12.92 : 1.055 * Math.pow(l, 1 / 2.4) - 0.055;
const aces = x => clamp01((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14));

// The pixels of an image (a data URI, so the page may read them).
function loadPixels(uri) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = image.width; canvas.height = image.height;
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0);
      resolve(context.getImageData(0, 0, image.width, image.height));
    };
    image.src = uri;
  });
}

// The color of one texel lit like Lit.frag: sun 3.0 and ambient 0.35, the eye straight in front.
function shade(base, normal, roughness, metalness, light) {
  const view = [0, 0, 1];
  const halfway = normalize([light[0], light[1], light[2] + 1]);
  const nl = Math.max(0, dot(normal, light)), nv = Math.max(1e-4, dot(normal, view));
  const nh = Math.max(0, dot(normal, halfway)), vh = Math.max(0, dot(view, halfway));
  const alpha = roughness * roughness, alpha2 = alpha * alpha, k = (roughness + 1) * (roughness + 1) / 8;
  const d = alpha2 / (Math.PI * Math.pow(nh * nh * (alpha2 - 1) + 1, 2));
  const g = (nv / (nv * (1 - k) + k)) * (nl / (nl * (1 - k) + k));
  const out = [];
  for (let c = 0; c < 3; c++) {
    const f0 = 0.04 * (1 - metalness) + base[c] * metalness;
    const f = f0 + (1 - f0) * Math.pow(1 - vh, 5);
    const specular = d * g * f / Math.max(1e-4, 4 * nv * Math.max(nl, 1e-4));
    const diffuse = (1 - f) * (1 - metalness) * base[c] / Math.PI;
    const ambient = 0.35 * (base[c] * (1 - metalness) + f0 * metalness);
    out.push(toSRGB(aces((diffuse + specular) * 3.0 * nl + ambient)) * 255);
  }
  return out;
}
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function normalize(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

// Draws a 2 x 2 tiling of a texture through pixelFunction(x, y) -> [r, g, b, a].
function drawTiled(canvas, width, height, pixelFunction) {
  const scale = +document.getElementById("scale").value;
  canvas.width = width * 2; canvas.height = height * 2;
  canvas.style.width = width * 2 * scale + "px"; canvas.style.height = height * 2 * scale + "px";
  const context = canvas.getContext("2d"), image = context.createImageData(width * 2, height * 2);
  for (let y = 0; y < height * 2; y++)
    for (let x = 0; x < width * 2; x++) {
      const value = pixelFunction(x % width, y % height), p = (y * width * 2 + x) * 4;
      image.data[p] = value[0]; image.data[p + 1] = value[1]; image.data[p + 2] = value[2]; image.data[p + 3] = value[3];
    }
  context.putImageData(image, 0, 0);
}

const loaded = [];
async function load() {
  const list = document.getElementById("list");
  for (const texture of textures) {
    const [color, normal, metalRough] = await Promise.all([loadPixels(texture.color), loadPixels(texture.normal),
                                                           loadPixels(texture.metalRough)]);
    const section = document.createElement("section");
    section.className = "texture";
    section.innerHTML = `<h2>${texture.name}</h2><div class="row">
      <figure><canvas></canvas><figcaption>Now: flat</figcaption></figure>
      <figure><canvas></canvas><figcaption>With the maps</figcaption></figure>
      <figure><canvas></canvas><figcaption>Normal map</figcaption></figure>
      <figure><canvas></canvas><figcaption>Roughness (green) and metal (blue)</figcaption></figure></div>`;
    list.appendChild(section);
    loaded.push({ color, normal, metalRough, canvases: section.querySelectorAll("canvas") });
  }
  drawAll();
}

function drawAll() {
  const azimuth = +document.getElementById("azimuth").value * Math.PI / 180;
  const elevation = +document.getElementById("elevation").value * Math.PI / 180;
  const light = [Math.cos(azimuth) * Math.cos(elevation), Math.sin(azimuth) * Math.cos(elevation), Math.sin(elevation)];
  for (const texture of loaded) {
    const { color, normal, metalRough, canvases } = texture, width = color.width, height = color.height;
    const texel = (image, x, y) => { const p = (y * width + x) * 4; return image.data.slice(p, p + 4); };
    const baseOf = (x, y) => {
      const c = texel(color, x, y);
      return [toLinear(c[0] / 255), toLinear(c[1] / 255), toLinear(c[2] / 255)];
    };
    // The rows of the image grow down, the V of the texture up: the green of the normal is up in the texture.
    const normalOf = (x, y) => {
      const n = texel(normal, x, y);
      return normalize([n[0] / 127.5 - 1, n[1] / 127.5 - 1, n[2] / 127.5 - 1]);
    };
    const alphaOf = (x, y) => texel(color, x, y)[3];
    drawTiled(canvases[0], width, height, (x, y) => [...shade(baseOf(x, y), [0, 0, 1], 0.8, 0, light), alphaOf(x, y)]);
    drawTiled(canvases[1], width, height, (x, y) => {
      const mr = texel(metalRough, x, y);
      return [...shade(baseOf(x, y), normalOf(x, y), Math.max(0.045, mr[1] / 255), mr[2] / 255, light), alphaOf(x, y)];
    });
    drawTiled(canvases[2], width, height, (x, y) => texel(normal, x, y));
    drawTiled(canvases[3], width, height, (x, y) => { const mr = texel(metalRough, x, y); return [0, mr[1], mr[2], 255]; });
  }
}

["azimuth", "elevation", "scale"].forEach(id => document.getElementById(id).addEventListener("input", drawAll));
load();
</script>
</body>
</html>
